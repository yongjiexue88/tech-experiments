# ═══════════════════════════════════════════════════════════════
# TCEQ Environmental Compliance Tracker — Application Config
# ═══════════════════════════════════════════════════════════════

# ── Server ────────────────────────────────────────────────────
server.port=8080

# ── H2 Database (Oracle Compatibility Mode) ───────────────────
spring.datasource.url=jdbc:h2:mem:tceqdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=tceq_admin
spring.datasource.password=tceq_pass

# ── H2 Web Console (for manual inspection) ───────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ── Schema Initialization ─────────────────────────────────────
# schema.sql runs first (DDL), then data.sql (DML seed data)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# ── Thymeleaf ─────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Logging ───────────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.tceq=DEBUG
