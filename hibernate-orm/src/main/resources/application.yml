server:
  port: 8080

spring:
  # 面试要点: Spring Boot DataSource 自动装配
  # 我们只需在配置文件中指定 URL 和驱动，Spring Boot 会自动扫描并创建
  # 一个 HikariCP (默认连接池) DataSource Bean。
  datasource:
    # 内存 SQLite 数据库，用于简化配置和演示
    url: "jdbc:sqlite::memory:"
    driver-class-name: org.sqlite.JDBC

  jpa:
    # 打印自动生成的 SQL (类似于之前的 hibernate.show_sql)
    show-sql: true
    properties:
      hibernate:
        # 美化格式化 SQL 输出
        format_sql: true
        # 指定社区版 SQLite 方言
        dialect: org.hibernate.community.dialect.SQLiteDialect
    
    # 面试要点: hbm2ddl.auto 模式
    # - create-drop: 启动创建表，关闭删除表 (这里为测试环境设定)
    # - validate: 验证映射，不修改表 (生产环境推荐)
    # - update: 自动更新 Schema (生产环境不推荐，应使用 Flyway / Liquibase)
    hibernate:
      ddl-auto: create-drop
