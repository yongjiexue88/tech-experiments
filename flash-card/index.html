<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompTIA Security+ Flashcards — SY0-701 Acronyms</title>
    <meta name="description"
        content="Interactive flashcard study tool for CompTIA Security+ SY0-701 certification acronyms." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Background blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <header>
        <h1>🔐 Security+ Flashcards</h1>
        <p class="subtitle">CompTIA SY0-701 — Acronym Drill</p>
    </header>

    <!-- Controls bar -->
    <div class="controls">
        <div class="mode-toggle">
            <button id="btnModeAcronym" class="mode-btn active" title="Show acronym, guess definition">Acronym →
                Definition</button>
            <button id="btnModeDefinition" class="mode-btn" title="Show definition, guess acronym">Definition →
                Acronym</button>
        </div>
        <div class="filter-controls">
            <button id="btnAll" class="filter-btn active">All</button>
            <button id="btnStarred" class="filter-btn">⭐ Starred</button>
            <button id="btnShuffle" class="filter-btn">🔀 Shuffle</button>
        </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <span class="progress-text" id="progressText">0 / 0</span>
    </div>

    <!-- Flashcard -->
    <div class="card-container" id="cardContainer">
        <div class="card" id="card" tabindex="0">
            <div class="card-face card-front" id="cardFront">
                <span class="card-label" id="frontLabel">ACRONYM</span>
                <span class="card-text" id="frontText"></span>
            </div>
            <div class="card-face card-back" id="cardBack">
                <span class="card-label" id="backLabel">DEFINITION</span>
                <span class="card-text" id="backText"></span>
            </div>
        </div>
    </div>

    <!-- Star button -->
    <div class="card-actions">
        <button id="btnStar" class="star-btn" title="Star this card">☆</button>
    </div>

    <!-- Navigation -->
    <div class="nav">
        <button id="btnPrev" class="nav-btn" aria-label="Previous card">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </button>
        <span class="card-counter" id="cardCounter">1 / 1</span>
        <button id="btnNext" class="nav-btn" aria-label="Next card">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6" />
            </svg>
        </button>
    </div>

    <!-- Search -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search acronyms or definitions…" autocomplete="off" />
    </div>

    <!-- Keyboard hints -->
    <footer>
        <p class="hint">
            <kbd>←</kbd> <kbd>→</kbd> Navigate &nbsp;·&nbsp;
            <kbd>Space</kbd> Flip &nbsp;·&nbsp;
            <kbd>S</kbd> Star &nbsp;·&nbsp;
            <kbd>/</kbd> Search
        </p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
